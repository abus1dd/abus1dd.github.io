<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self'; base-uri 'none'; form-action 'none'">
<meta name="robots" content="noindex">
<title>Page not found · Abu Bakar Siddiq</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tilt+Neon&family=IBM+Plex+Sans:wght@400;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
:root{--bg:#05070F;--fg:#E8F8FF;--muted:#93B7D2;--cyan:#00E5FF;--mag:#FF3DCB;--card:#0B1330;--line:rgba(0,229,255,.26);--grid:rgba(0,229,255,.08);--btnfg:#02050D;color-scheme:dark}
@media (prefers-color-scheme:light){:root{--bg:#ECE4D6;--fg:#1B2433;--muted:#4A5568;--cyan:#086772;--mag:#B8308A;--card:#FFFDF7;--line:rgba(27,36,51,.2);--grid:rgba(27,36,51,.06);--btnfg:#FFFFFF;color-scheme:light}}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--fg)}
body{min-height:100vh;display:grid;place-items:center;padding:32px 16px;font:400 17px/1.55 'IBM Plex Sans',system-ui,sans-serif;background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:56px 56px;background-position:center}
main{width:min(560px,100%);text-align:center}
.code{margin:0;font:400 clamp(88px,24vw,150px)/1 'Tilt Neon',system-ui,sans-serif;color:#F2FDFF;text-shadow:0 0 2px #fff,0 0 10px var(--cyan),0 0 26px var(--cyan),0 0 60px rgba(0,229,255,.5)}
@media (prefers-color-scheme:light){.code{color:var(--fg);text-shadow:none}}
.k{margin:18px 0 6px;font:500 12px/1 'IBM Plex Mono',monospace;letter-spacing:.16em;text-transform:uppercase;color:var(--mag)}
h1{margin:0 0 10px;font:600 26px/1.25 'IBM Plex Sans',system-ui,sans-serif}
p{margin:0 0 6px;color:var(--muted)}
.paper{display:inline-block;margin:26px 0 30px;padding:10px 16px;border-radius:4px;background:var(--card);border:1px solid var(--line);transform:rotate(-4deg);font:500 13px/1.4 'IBM Plex Mono',monospace;color:var(--muted)}
a.btn{display:inline-flex;align-items:center;gap:8px;min-height:48px;padding:0 24px;border-radius:999px;background:var(--cyan);color:var(--btnfg);font-weight:600;text-decoration:none}
a.btn:focus-visible{outline:3px solid var(--mag);outline-offset:3px}
.it{margin-top:28px;padding-top:18px;border-top:1px solid var(--line)}
.it h2{margin:0 0 6px;font:600 18px/1.3 'IBM Plex Sans',system-ui,sans-serif}
</style>
</head>
<body>
<main>
  <p class="code" aria-hidden="true">404</p>
  <p class="k">Page not found</p>
  <h1>This page fell off the desk.</h1>
  <p>The link may be old or mistyped. Everything about Abu is back on the desk.</p>
  <div class="paper" aria-hidden="true">~/missing-page: no such file</div>
  <div><a class="btn" href="/">← Back to the desk</a></div>
  <div class="it" lang="it">
    <h2>Pagina non trovata</h2>
    <p>Questa pagina è caduta dalla scrivania. <a href="/" style="color:var(--cyan)">Torna alla scrivania</a>.</p>
  </div>
</main>
</body>
</html>
